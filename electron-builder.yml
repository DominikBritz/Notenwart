appId: de.britz.notenwart
productName: Notenwart
copyright: Copyright © 2026 Dominik Britz
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
asar: true
mac:
  category: public.app-category.music
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  # Ad-hoc-Signatur ("-"): ohne Apple-Zertifikat, aber mit gültigem Siegel. Mit
  # identity: null bleibt das Siegel kaputt, macOS meldet dann "beschädigt".
  identity: "-"
  hardenedRuntime: false
  gatekeeperAssess: false
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  signAndEditExecutable: false
portable:
  artifactName: ${productName}-Portable-${version}.exe
nsis:
  artifactName: ${productName}-Setup-${version}.exe
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  language: 1031
npmRebuild: false
